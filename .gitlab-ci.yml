image: node:22.18.0

stages:
  - validate

variables:
  PNPM_STORE_DIR: .pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

validate:
  stage: validate
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  script:
    - node -e 'const config = require("./vercel.json"); if (config.git?.deploymentEnabled !== false) process.exit(1)'
    - pnpm format:check
    - pnpm lint
    - pnpm build
